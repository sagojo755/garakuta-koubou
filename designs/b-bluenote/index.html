<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>案B ブルーノート風 | Tadashi's Audio</title>
<style>
:root{--ink:#111;--paper:#f2ede1;--blue:#1f4e8c;--red:#c8372d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Gothic","Hiragino Sans",sans-serif;font-size:19px;line-height:1.8}
img{max-width:100%;display:block}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:14px 28px;border-bottom:4px solid var(--ink)}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:.02em;font-family:Impact,"Arial Black",sans-serif;text-transform:uppercase}
nav a{color:var(--ink);text-decoration:none;font-weight:700;margin-left:22px}
nav a:hover{color:var(--red)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;border-bottom:4px solid var(--ink)}
.hero .txt{background:var(--blue);color:var(--paper);padding:56px 36px;display:flex;flex-direction:column;justify-content:center}
.hero h1{margin:0 0 .4em;font-size:2.8rem;line-height:1.2;font-weight:900}
.hero h1 span{color:#ffd23f}
.hero .pic{background:url(../../images/hero.jpg) center/cover;min-height:360px;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply;background-color:var(--blue)}
.btn{display:inline-block;margin-top:14px;background:var(--paper);color:var(--ink);padding:12px 28px;font-weight:900;text-decoration:none;border:3px solid var(--ink);width:fit-content}
.btn:hover{background:var(--red);color:#fff}
section{max-width:1000px;margin:0 auto;padding:52px 24px}
h2{font-size:2rem;font-weight:900;margin:0 0 20px;text-transform:uppercase;border-left:14px solid var(--red);padding-left:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:#fff;border:4px solid var(--ink)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;filter:grayscale(1) contrast(1.1)}
.card div{padding:14px 18px}
.tag{background:var(--ink);color:var(--paper);font-size:.8rem;padding:2px 10px}
.card h3{margin:.4em 0 0}
footer{background:var(--ink);color:var(--paper);text-align:center;padding:24px;font-size:.85rem}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero h1{font-size:2rem}nav a{margin:0 14px 0 0}}
</style></head><body>
<header><div class="logo">Tadashi's Audio</div>
<nav><a href="#">ホーム</a><a href="#">私について</a><a href="#">修理実績</a><a href="#">連絡先</a></nav></header>
<div class="hero"><div class="txt">
<h1>古いアンプに、<br><span>もう一度ジャズを。</span></h1>
<p>レコードとジャズが好きで、アンプとスピーカーの修理を続けています。</p>
<a class="btn" href="#">修理の記録を見る →</a></div>
<div class="pic"></div></div>
<section><h2>Recent Repairs</h2>
<div class="cards">
<article class="card"><img src="../../images/repair1.jpg" alt=""><div><span class="tag">スピーカー</span><h3>ブックシェルフ型スピーカー</h3><p>片側から音が出ない症状を修理</p></div></article>
<article class="card"><img src="../../images/repair2.jpg" alt=""><div><span class="tag">アンプ</span><h3>プリメインアンプ</h3><p>ガリノイズを解消</p></div></article>
</div></section>
<footer>&copy; Tadashi's Audio</footer>
</body></html>
