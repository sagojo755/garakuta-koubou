<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>案C 工房ノート風 | Tadashi's Audio</title>
<style>
:root{--cream:#f6efe0;--wood:#7a4f2b;--ink:#3a2a1c;--green:#4d6b4a;--line:#dccfb4}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;line-height:1.95}
img{max-width:100%;display:block}
header{background:var(--wood);color:var(--cream)}
.hi{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.logo{font-size:1.4rem;letter-spacing:.1em}
nav a{color:var(--cream);text-decoration:none;margin-left:20px}
nav a:hover{text-decoration:underline}
.hero{max-width:960px;margin:32px auto 0;padding:0 20px}
.hero .frame{border:10px solid #fff;box-shadow:0 6px 18px rgba(60,40,20,.25);transform:rotate(-.8deg)}
.hero img{aspect-ratio:16/8;object-fit:cover;width:100%}
.lead{max-width:960px;margin:28px auto 0;padding:0 20px;text-align:center}
.lead h1{font-size:2rem;margin:0 0 .3em;color:var(--wood);font-weight:normal}
.btn{display:inline-block;margin-top:10px;background:var(--green);color:#fff;padding:14px 34px;border-radius:40px;text-decoration:none}
.btn:hover{background:var(--wood)}
section{max-width:960px;margin:0 auto;padding:48px 20px}
h2{color:var(--wood);font-weight:normal;font-size:1.6rem;text-align:center;margin:0 0 24px}
h2::after{content:"";display:block;width:60px;height:3px;background:var(--green);margin:8px auto 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.card{background:#fffaf0;border:1px solid var(--line);padding:12px 12px 4px;box-shadow:0 3px 8px rgba(60,40,20,.15)}
.card:nth-child(odd){transform:rotate(-.6deg)}.card:nth-child(even){transform:rotate(.6deg)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.card h3{margin:.6em 0 0;font-size:1.1rem}
.tag{background:var(--green);color:#fff;font-size:.8rem;padding:1px 10px;border-radius:12px}
.card p{margin:.2em 0 .6em;font-size:.95rem;color:#6b5844}
footer{text-align:center;padding:28px;color:#8b7860;font-size:.85rem;border-top:1px solid var(--line)}
@media(max-width:700px){nav a{margin:0 14px 0 0}.lead h1{font-size:1.5rem}}
</style></head><body>
<header><div class="hi"><div class="logo">Tadashi's Audio</div>
<nav><a href="#">ホーム</a><a href="#">私について</a><a href="#">修理実績</a><a href="#">連絡先</a></nav></div></header>
<div class="hero"><div class="frame"><img src="../../images/about.jpg" alt=""></div></div>
<div class="lead"><h1>音を、手入れしています。</h1>
<p>ジャズとレコードを愛する、アンプ・スピーカー修理の工房ノートです。</p>
<a class="btn" href="#">修理ノートを見る</a></div>
<section><h2>最近の修理ノート</h2>
<div class="cards">
<article class="card"><img src="../../images/repair1.jpg" alt=""><span class="tag">スピーカー</span><h3>ブックシェルフ型スピーカー</h3><p>片側から音が出ない症状を修理</p></article>
<article class="card"><img src="../../images/repair2.jpg" alt=""><span class="tag">アンプ</span><h3>プリメインアンプ</h3><p>ガリノイズを解消</p></article>
</div></section>
<footer>&copy; Tadashi's Audio</footer>
</body></html>
